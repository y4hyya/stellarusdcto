name: Registry check

# Circle adds chains and can change contract addresses. A static site only
# stays current if someone notices, so this job diffs Circle's machine
# readable docs against the bundled registry every week and fails on drift.

on:
    schedule:
        - cron: '0 9 * * 1'
    workflow_dispatch:

jobs:
    diff:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec tsx scripts/check-circle-docs.ts
